name: Capture screenshots

on:
  push:
    branches: [screenshots-temp]
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --console=plain

      - name: Boot emulator and capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -eux
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm clear pt.carrismetropolitana.tracker || true
            adb push tools/ci_carris_prefs.xml /data/local/tmp/carris_tracker.xml
            adb shell chmod 644 /data/local/tmp/carris_tracker.xml
            adb shell run-as pt.carrismetropolitana.tracker mkdir -p shared_prefs
            adb shell run-as pt.carrismetropolitana.tracker cp /data/local/tmp/carris_tracker.xml shared_prefs/carris_tracker.xml
            adb shell am start -W -n pt.carrismetropolitana.tracker/.MainActivity
            python3 tools/ci_capture.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/*.png
          if-no-files-found: error
